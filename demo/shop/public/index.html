<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--SEO-->
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/styles.css">
  <script src="/boot.js"></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="nav" id="nav">
    <div class="wrap nav__in">
      <a class="brand" href="/">Fieldnote<span> Goods</span></a>
      <nav aria-label="Main">
        <a href="/" data-route="/">Shop</a>
        <a href="/orders" data-route="/orders">Orders</a>
      </nav>
      <div class="nav__end">
        <a class="btn btn--ghost" id="login-link" href="/login">Log in</a>
        <button class="btn btn--ghost" id="logout-btn" type="button" hidden>Log out</button>
        <button class="btn btn--cart" id="cart-btn" type="button" aria-haspopup="dialog" aria-label="Cart, 0 items">
          Cart <span class="count" id="cart-count" aria-hidden="true">0</span>
        </button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1"><!--MAIN--></main>

  <footer class="footer">
    <div class="wrap">
      <p>Demo shop. Payments are simulated and no real orders are placed.</p>
    </div>
  </footer>

  <dialog class="drawer" id="cart" aria-labelledby="cart-title">
    <div class="drawer__head">
      <h2 id="cart-title">Your cart</h2>
      <button class="btn btn--ghost" id="cart-close" type="button">Close</button>
    </div>
    <div class="drawer__body" id="cart-body"></div>
    <div class="drawer__foot">
      <p class="total"><span>Total</span><strong id="cart-total">$0.00</strong></p>
      <a class="btn btn--primary btn--block" id="to-checkout" href="/checkout">Go to checkout</a>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
